name: Verify skill foundation
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_spec.py --spec examples/sate-match.game-spec.json
      - run: python3 scripts/validate_spec.py --spec examples/memory-match.game-spec.json
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Starter JS tests and build
        working-directory: templates/mobile-portrait
        run: |
          npm install
          npm test
          npm run build
